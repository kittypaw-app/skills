[package]
id = "weather-briefing"
name = "매일 아침 날씨 브리핑"
version = "1.0.3"
license = "Elastic-2.0"
description = "매일 아침 설정한 지역의 날씨 예보를 요약해서 텔레그램으로 보내줍니다. 지금/현재/몇 시간 뒤 날씨 즉답은 '날씨 조회' 스킬을 사용하세요."
author = "KittyPaw Team"
category = "weather"
tags = ["weather", "daily", "llm", "open-meteo"]

[trigger]
type = "schedule"
cron = "0 7 * * *"

[permissions]
primitives = ["Http", "Llm"]
allowed_hosts = ["api.open-meteo.com", "api.kittypaw.app"]
context = ["locale", "location"]

[attribution]
policy = "required-only"

[[attribution.providers]]
id = "open-meteo"
name = "Open-Meteo"
label = "Weather data by Open-Meteo.com"
url = "https://open-meteo.com"
required = true

[[attribution.providers]]
id = "kma"
name = "KMA"
label = "Weather data by KMA"
url = "https://apihub.kma.go.kr"
required = false

[[config.fields]]
key = "telegram_token"
label = "텔레그램 봇 토큰"
type = "secret"
required = true

[[config.fields]]
key = "chat_id"
label = "텔레그램 Chat ID"
type = "string"
required = true

[[config.fields]]
key = "city"
label = "City Name (display only)"
type = "string"
required = false
default = "Seoul"

[[config.fields]]
key = "latitude"
label = "위도"
type = "string"
required = false
default = "37.57"

[[config.fields]]
key = "longitude"
label = "경도"
type = "string"
required = false
default = "126.98"

[[config.fields]]
key = "schedule"
label = "Cron Schedule"
type = "cron"
required = false
default = "0 7 * * *"
