[package]
id = "air-quality"
name = "미세먼지 알림"
version = "2.0.2"
license = "Elastic-2.0"
description = "KittyAPI AirKorea 프록시로 미세먼지/초미세먼지 등급을 확인하고 알려줍니다."
author = "KittyPaw Team"
category = "health"
tags = ["air", "dust", "health", "korea"]

[trigger]
type = "schedule"
cron = "0 7 * * *"

[permissions]
primitives = ["Http"]
allowed_hosts = ["localhost", "127.0.0.1", "api.kittypaw.app"]
context = ["locale"]

[[config.fields]]
key = "telegram_token"
label = "텔레그램 봇 토큰"
type = "secret"
required = true

[[config.fields]]
key = "chat_id"
label = "텔레그램 Chat ID"
type = "string"
required = true

[[config.fields]]
key = "api_url"
label = "API Server URL"
type = "string"
required = false
default = "https://api.kittypaw.app"
source = "kittypaw-api/api_url"

[[config.fields]]
key = "station"
label = "측정소명"
type = "string"
required = false
default = "종로구"
hint = "가까운 측정소명 (예: 종로구, 강남구, 해운대구)"

[[config.fields]]
key = "schedule"
label = "Cron Schedule"
type = "cron"
required = false
default = "0 7 * * *"
