[package]
id = "weather-now"
name = "현재 날씨"
version = "1.1.0"
description = "현재 날씨를 즉답합니다. 한국 좌표는 기상청(KMA, KittyAPI 경유), 그 외는 wttr.in. 알람용 weather-briefing 과 별개의 즉답형 skill."
author = "KittyPaw Team"
category = "weather"
tags = ["weather", "now", "kma", "wttr", "instant"]

[trigger]
type = "manual"

[permissions]
primitives = ["Http"]
allowed_hosts = ["wttr.in", "api.kittypaw.app"]
context = ["location"]

[[config.fields]]
key = "location"
label = "도시 / 위치"
type = "string"
required = false
default = "Seoul"

[[config.fields]]
key = "latitude"
label = "위도 (한국 좌표면 KMA 사용)"
type = "string"
required = false
default = ""

[[config.fields]]
key = "longitude"
label = "경도 (한국 좌표면 KMA 사용)"
type = "string"
required = false
default = ""
