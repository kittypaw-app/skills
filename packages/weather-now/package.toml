[package]
id = "weather-now"
name = "현재 날씨"
version = "1.2.2"
license = "Elastic-2.0"
description = "지금 시점 (현재 / 방금 / 막) 날씨 즉답. 한국 좌표는 기상청 KMA 초단기실황, 그 외는 wttr.in. 1시간 이상 미래 발화는 weather-soon (초단기예보) 또는 weather-briefing (단기예보). 알람 / 발송용은 weather-briefing."
author = "KittyPaw Team"
category = "weather"
tags = ["weather", "now", "kma", "wttr", "instant", "nowcast"]

[trigger]
type = "manual"

# Forward-compatible skill discovery contract — kittypaw currently ignores
# this section (BurntSushi/toml lenient mode). Plan 8 (Skill Discovery)
# will surface it to the LLM so intent → skill mapping becomes explicit
# instead of relying on description keyword guessing.
[discovery]
time_scope = "now"
trigger_examples = [
  "지금 서울 날씨", "현재 기온", "방금 비 와?", "지금 몇 도?",
  "지금 강남역 비 와?", "광화문 지금 비?", "코엑스 날씨",
]
anti_examples = ["내일 날씨", "1시간 후 비?", "주말 날씨", "오늘 오후"]

[discovery.delegates_to]
soon = "weather-soon"
future = "weather-briefing"

# Location capability declaration. The engine/LLM resolves natural-language
# place mentions and passes deterministic `ctx.params.location` to the package.
# Official JS packages must not parse raw utterance strings themselves.
[capabilities.location]
accepts = ["coord", "natural_poi", "city"]
resolution = "engine"

[invocation]
execution_model = "deterministic"
caller_responsibilities = [
  "Classify current-weather intent before calling this package.",
  "Extract explicit place mentions into ctx.params.location; do not ask the package to parse raw user text.",
  "If an explicit place mention cannot be resolved, clarify or report the resolution failure instead of running this package with a default location.",
]
missing_slot_policy = "Use ctx.user.location or config.location only when the user did not explicitly name a place."
postprocess = "The caller may rephrase the package output for tone, but must not invent weather facts or replace the package location with a different place."

[[invocation.inputs]]
key = "location"
path = "ctx.params.location"
type = "object"
required = false
resolver = "engine"
fields = ["label", "lat", "lon"]
description = "Resolved location for the current-weather question. label is display text; lat/lon drive KMA lookup when inside Korea."

[attribution]
policy = "required-only"

[[attribution.providers]]
id = "kma"
name = "KMA"
label = "Weather data by KMA"
url = "https://apihub.kma.go.kr"
required = false

[[attribution.providers]]
id = "wttr"
name = "wttr.in"
label = "Weather data by wttr.in"
url = "https://wttr.in"
required = false

[permissions]
primitives = ["Http"]
allowed_hosts = ["wttr.in", "api.kittypaw.app"]
context = ["location"]

[[config.fields]]
key = "location"
label = "도시 / 위치"
type = "string"
required = false
default = "Seoul"

[[config.fields]]
key = "latitude"
label = "위도 (한국 좌표면 KMA 사용)"
type = "string"
required = false
default = ""

[[config.fields]]
key = "longitude"
label = "경도 (한국 좌표면 KMA 사용)"
type = "string"
required = false
default = ""
